<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Trionyx Solutions | Web Development & IT Services</title>

    <meta
      name="description"
      content="Trionyx Solutions provides modern website development, business websites, portfolio websites, AI-driven systems, and scalable digital solutions for startups and local businesses."
    />

    <meta
      name="keywords"
      content="Trionyx Solutions, web development company, website development India, business website, portfolio website, IT solutions, AI solutions, startup website, local business website"
    />

    <meta name="author" content="Trionyx Solutions" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL: use this only if non-www redirects to www -->
    <link rel="canonical" href="https://www.trionyxsols.co.in/" />

    <!-- Favicon for browser + Google Search -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:title" content="Trionyx Solutions | Web Development & IT Services" />
    <meta
      property="og:description"
      content="Modern websites, AI-driven systems, mobile solutions, and scalable digital products for startups and businesses."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.trionyxsols.co.in/" />
    <meta property="og:image" content="https://www.trionyxsols.co.in/logo.png" />
    <meta property="og:site_name" content="Trionyx Solutions" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trionyx Solutions | Web Development & IT Services" />
    <meta
      name="twitter:description"
      content="Trionyx Solutions builds websites, mobile apps, AI systems, and scalable digital solutions for modern businesses."
    />
    <meta name="twitter:image" content="https://www.trionyxsols.co.in/logo.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#020617" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!-- Structured Data for Google site name + organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Trionyx Solutions",
            "alternateName": ["Trionyx", "trionyxsols.co.in"],
            "url": "https://www.trionyxsols.co.in/"
          },
          {
            "@type": "Organization",
            "name": "Trionyx Solutions",
            "url": "https://www.trionyxsols.co.in/",
            "logo": "https://www.trionyxsols.co.in/icon.png",
            "description": "Trionyx Solutions provides website development, business websites, portfolio websites, AI-driven systems, mobile solutions, and scalable digital products."
          }
        ]
      }
    </script>

    <!-- Theme Script -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("Trionyx-theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";

          var r = document.documentElement;

          if (t === "dark") r.classList.add("dark");
          else r.classList.remove("dark");

          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
